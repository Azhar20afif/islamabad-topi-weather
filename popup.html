<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Personal Weather Extension</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,640&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="flag-bar" aria-hidden="true"></div>
    <div class="popup-inner">
      <header>
        <p class="badge">Personal weather extension</p>
        <div class="title-row">
          <svg class="crest" viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="24" r="23" fill="none" stroke="#e8c547" stroke-width="1.4" />
            <path
              fill="#f7f4ea"
              d="M28.2 12.4a11.4 11.4 0 1 0 7.4 20.1 13.6 13.6 0 1 1-7.4-20.1z"
            />
            <path
              fill="#e8c547"
              d="M33.6 16.2 35 20.4l4.4.3-3.4 2.8 1.1 4.2-3.5-2.5-3.5 2.5 1.1-4.2-3.4-2.8 4.4-.3z"
            />
          </svg>
          <div>
            <h1>Personal Weather</h1>
            <p class="subtitle">Islamabad · Topi · Pakistan</p>
          </div>
        </div>
      </header>

      <p id="status" class="status" role="status">Fetching forecast…</p>
      <p id="error" class="error" hidden></p>

      <main id="cards" class="cards" hidden>
        <article class="card" data-city="islamabad">
          <h2>Islamabad</h2>
          <p class="temp"><span class="temp-value">--</span><span class="unit">°C</span></p>
          <p class="range">Today --° / --° · Tomorrow --° / --°</p>
          <p class="highlight">—</p>
        </article>
        <article class="card" data-city="topi">
          <h2>Topi</h2>
          <p class="temp"><span class="temp-value">--</span><span class="unit">°C</span></p>
          <p class="range">Today --° / --° · Tomorrow --° / --°</p>
          <p class="highlight">—</p>
        </article>
      </main>

      <footer>
        <p>Click the toolbar icon to open this popup</p>
        <p>Forecast by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p>
      </footer>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
